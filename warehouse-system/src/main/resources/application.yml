spring:
  application:
    name: warehouse-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-0123456789abcdef0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

